<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Bejelentkezés - ReviewAgent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center">Üdvözöljük újra!</h2>
        <input id="email" type="email" placeholder="Email cím" class="w-full p-3 rounded bg-slate-900 border border-slate-700 mb-4 outline-none focus:border-blue-500">
        <button onclick="login()" class="w-full bg-blue-600 p-3 rounded font-bold hover:bg-blue-500 transition">Belépés a Dashboardra</button>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const res = await fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('business_id', data.business_id);
                localStorage.setItem('business_name', data.business_name);
                window.location.href = 'dashboard.html';
            } else {
                alert(data.detail);
            }
        }
    </script>
</body>
</html>
